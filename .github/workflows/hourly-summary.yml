name: Resumen horario

# Se lanza al minuto 2 de cada hora (evita la hora en punto, que va más cargada).
# GitHub puede retrasarlo unos minutos.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-summary
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al endpoint del resumen
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST "${APP_URL%/}/api/jobs/summary" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo
