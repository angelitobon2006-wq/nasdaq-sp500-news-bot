name: Noticias (cada 5 minutos)

# GitHub puede retrasar las ejecuciones programadas varios minutos.
# No hay garantía de precisión exacta de 5 minutos.
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

# Si una ejecución tarda, la siguiente espera su turno (nunca se pisan)
concurrency:
  group: news-check
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al endpoint de noticias
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST "${APP_URL%/}/api/jobs/news" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo
